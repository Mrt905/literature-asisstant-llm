<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tumor Microbiome Literature Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #2c3e50;
            padding-bottom: 10px;
        }
        textarea {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: vertical;
            box-sizing: border-box;
        }
        button {
            margin-top: 10px;
            padding: 10px 25px;
            font-size: 16px;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #34495e;
        }
        #answer-box {
            margin-top: 20px;
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            border: 1px solid #ccc;
            display: none;
        }
        #answer-text {
            font-size: 16px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        #usage-box {
            margin-top: 10px;
            font-size: 13px;
            color: #888;
        }
        #loading {
            display: none;
            margin-top: 15px;
            color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>🔬 Tumor Microbiome Literature Assistant</h1>
    <p>Ask a question about tumor microbiome based on the provided scientific papers.</p>

    <textarea id="question" rows="4" 
              placeholder="e.g. What bacteria are associated with lung cancer?"></textarea>
    <br>
    <button onclick="askQuestion()">Ask</button>

    <div id="loading">Searching papers and generating answer...</div>

    <div id="answer-box">
        <h3>Answer:</h3>
        <div id="answer-text"></div>
        <div id="usage-box"></div>
    </div>

    <script>
        async function askQuestion() {
            const question = document.getElementById("question").value.trim();
            
            if (!question) {
                alert("Please enter a question!");
                return;
            }

            // show loading, hide answer
            document.getElementById("loading").style.display = "block";
            document.getElementById("answer-box").style.display = "none";

            try {
                const response = await fetch("/ask", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({question: question})
                });

                const data = await response.json();

                // show answer
                document.getElementById("answer-text").innerText = data.answer;
                document.getElementById("usage-box").innerText = 
                    `Tokens used — Input: ${data.usage.input_tokens}, Output: ${data.usage.output_tokens}, Total: ${data.usage.total_tokens}`;
                
                document.getElementById("answer-box").style.display = "block";

            } catch (error) {
                document.getElementById("answer-text").innerText = "Error: " + error.message;
                document.getElementById("answer-box").style.display = "block";
            } finally {
                document.getElementById("loading").style.display = "none";
            }
        }

        // allow pressing Enter to submit
        document.getElementById("question").addEventListener("keydown", function(e) {
            if (e.key === "Enter" && e.ctrlKey) {
                askQuestion();
            }
        });
    </script>
</body>
</html>
